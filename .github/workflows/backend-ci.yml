name: Backend - pruebas y seguridad

on:
  push:
    branches:
      - main
      - crm/gestion-colegios
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Archivos sensibles bajo seguimiento
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar archivos generados o privados versionados
        shell: bash
        run: |
          if [ -n "$(git ls-files -- '.env' 'db.sqlite3' 'media/**' 'staticfiles/**' ':(glob)**/__pycache__/**' ':(glob)**/*.pyc')" ]; then
            echo "::error::El repositorio aún sigue archivos locales, sensibles o generados. Revisar respaldo y retirar del índice de Git de forma coordinada; no borrar datos automáticamente."
            exit 1
          fi

  tests:
    name: Django y PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bookexpress_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bookexpress_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME: bookexpress_ci
      DB_USER: postgres
      DB_PASSWORD: ci-postgres-only
      DB_HOST: localhost
      DB_PORT: "5432"
      DEBUG: "True"
      SECRET_KEY: "ci-only-key-example-not-for-production-87jkR3xQ6mVfT9gNpL4sZwE1cYhU2bDa"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verificar configuración y migraciones
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Revisar seguridad con configuración simulada
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: "testserver"
          SECURE_SSL_REDIRECT: "True"
          SECURE_HSTS_SECONDS: "3600"
        run: python manage.py check --deploy --fail-level WARNING
      - name: Ejecutar tests Django en base temporal
        run: python manage.py test --noinput
